services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: sculptos-orthanc
    restart: unless-stopped
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__NAME: "SculptOS Orthanc"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"orthanc":"orthanc"}'
      ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ENABLE_WADO: "true"
      ORTHANC__HTTP_SERVER__PORT: "8042"
      ORTHANC__DICOM_SERVER__PORT: "4242"
    volumes:
      - orthanc-db:/var/lib/orthanc/db

volumes:
  orthanc-db:
